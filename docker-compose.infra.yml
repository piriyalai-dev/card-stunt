# Pixel Stand — data layer (Postgres + Redis)
# Swarm-ready: แชร์ network `pixelstand-internal` กับ stack app
# ⚠️ Phase 2 ยังไม่ deploy — ใช้ `docker compose config` เช็ค syntax + test harness (docker-compose.test.yml) แทน
version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      # postgres image อ่าน password จากไฟล์นี้ (ไม่ต้องฝังใน env)
      - POSTGRES_PASSWORD_FILE=/run/secrets/pixelstand_postgres_password
    secrets:
      - pixelstand_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pixelstand-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.25', memory: 256M }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pixelstand-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 32M }

volumes:
  # ชื่อ volume คงที่ (single environment — ไม่มี ENV_NAME แบบ prsc)
  postgres_data:
    name: pixelstand_postgres_data
  redis_data:
    name: pixelstand_redis_data

secrets:
  pixelstand_postgres_password:
    external: true

networks:
  pixelstand-internal:
    external: true
