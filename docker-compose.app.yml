# Pixel Stand — application (backend + frontend)
# Swarm-ready: traefik labels + external network (ยังไม่ deploy ใน Phase 2)
# worker (ARQ export) มาใน Phase 5
version: "3.8"

services:
  backend:
    image: pixelstand-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pixelstand_infra_db:5432/${POSTGRES_DB}
      # ⚠️ .env ใช้ localhost สำหรับรันบน host — ใน container ต้องชี้ service ของ infra stack
      - REDIS_URL=redis://pixelstand_infra_redis:6379/1
    volumes:
      # reference image/thumbnail — persist ข้าม redeploy (Phase 5 จะมี signed URL)
      - media_data:/data/media
    networks:
      - pixelstand-internal
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pixelstand_backend.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.services.pixelstand_backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"

  frontend:
    image: pixelstand-frontend:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pixelstand_frontend.rule=Host(`${WEB_DOMAIN}`)"
        - "traefik.http.services.pixelstand_frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

volumes:
  media_data:
    name: pixelstand_media_data

networks:
  traefik-public:
    external: true
  pixelstand-internal:
    external: true
