# Pixel Stand — application (backend + frontend + ARQ export worker)
# Swarm-ready: traefik labels + external network
version: "3.8"

services:
  backend:
    image: pixelstand-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # ⚠️ .env ใช้ localhost สำหรับรันบน host — ใน container ต้องชี้ service ของ infra stack
      - DATABASE_URL=postgresql://${POSTGRES_USER}@pixelstand_infra_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://pixelstand_infra_redis:6379/1
      # sensitive ถูก override เป็นว่าง (env_file) ⇒ อ่านจาก Docker secret แทน (core/config.py)
      - API_KEY=
      - SECRET_KEY=
      - JWT_SECRET=
      - POSTGRES_PASSWORD=
    secrets:
      - pixelstand_postgres_password
      - pixelstand_api_key
      - pixelstand_secret_key
      - pixelstand_jwt_secret
    volumes:
      # reference image/thumbnail — persist ข้าม redeploy (served ผ่าน signed URL)
      - media_data:/data/media
      # ไฟล์ export — worker เขียน, backend อ่านมาตอบ download
      - export_data:/data/exports
    networks:
      - pixelstand-internal
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.25', memory: 256M }
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pixelstand_backend.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.services.pixelstand_backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"
        # 🔒 HTTPS: uncomment 3 บรรทัดล่าง เมื่อ global_proxy traefik มี :443 + ACME certresolver แล้ว
        #    (ดู docs/4-developer-playbook/production-hardening.md) — อย่าเปิดก่อน ไม่งั้น route HTTP พัง
        # - "traefik.http.routers.pixelstand_backend.entrypoints=websecure"
        # - "traefik.http.routers.pixelstand_backend.tls=true"
        # - "traefik.http.routers.pixelstand_backend.tls.certresolver=letsencrypt"

  # ── ARQ worker (export PDF/CSV/ZIP) ────────────────────────────────
  # ใช้ image เดียวกับ backend แต่ override command · max_jobs=1 ใน WorkerSettings
  worker:
    image: pixelstand-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "workers.export_worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}@pixelstand_infra_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://pixelstand_infra_redis:6379/1
      # sensitive ถูก override เป็นว่าง (env_file) ⇒ อ่านจาก Docker secret แทน (core/config.py)
      - API_KEY=
      - SECRET_KEY=
      - JWT_SECRET=
      - POSTGRES_PASSWORD=
    secrets:
      - pixelstand_postgres_password
      - pixelstand_api_key
      - pixelstand_secret_key
      - pixelstand_jwt_secret
    volumes:
      - media_data:/data/media
      - export_data:/data/exports
    networks:
      - pixelstand-internal
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1.5', memory: 2G }
        reservations: { cpus: '0.25', memory: 256M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  frontend:
    image: pixelstand-frontend:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
    healthcheck:
      # ⚠️ ใช้ 127.0.0.1 ไม่ใช่ localhost — ใน alpine `localhost` resolve เป็น `::1` (IPv6)
      #    แต่ nginx bind แค่ IPv4 ⇒ busybox wget ไม่ fallback → healthcheck หลุด (Connection refused)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 32M }
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pixelstand_frontend.rule=Host(`${WEB_DOMAIN}`)"
        - "traefik.http.services.pixelstand_frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"
        # 🔒 HTTPS: uncomment 3 บรรทัดล่าง เมื่อ global_proxy traefik มี :443 + ACME certresolver แล้ว
        # - "traefik.http.routers.pixelstand_frontend.entrypoints=websecure"
        # - "traefik.http.routers.pixelstand_frontend.tls=true"
        # - "traefik.http.routers.pixelstand_frontend.tls.certresolver=letsencrypt"

volumes:
  media_data:
    name: pixelstand_media_data
  export_data:
    name: pixelstand_export_data

secrets:
  pixelstand_postgres_password:
    external: true
  pixelstand_api_key:
    external: true
  pixelstand_secret_key:
    external: true
  pixelstand_jwt_secret:
    external: true

networks:
  traefik-public:
    external: true
  pixelstand-internal:
    external: true
